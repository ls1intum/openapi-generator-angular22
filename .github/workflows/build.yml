name: Build and Publish

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: gradle
    
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    
    - name: Test release metadata check
      run: bash scripts/test-verify-release.sh

    - name: Build with Gradle
      run: ./gradlew build
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: jar
        path: build/libs/*.jar

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: gradle
    
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    
    - name: Verify release metadata
      env:
        RELEASE_TAG: ${{ github.ref_name }}
      run: bash scripts/verify-release.sh "$RELEASE_TAG"

    - name: Publish to Maven Central
      # Uploads the signed artifacts to the Central Portal and (automaticRelease = true) releases them.
      # Central Portal auth comes from this repo's own secrets (a de.tum.cit.aet Central Portal user
      # token); the GPG signing key is the shared ls1intum org secret (GPG_KEY / GPG_PASSPHRASE, granted
      # to this repo), matching the Helios release-maven.yml convention. See RELEASING.md.
      run: ./gradlew publishToMavenCentral --no-configuration-cache
      env:
        ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
        ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_KEY }}
        ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_PASSPHRASE }}

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: build/libs/*.jar
        body_path: release-notes/${{ github.ref_name }}.md
