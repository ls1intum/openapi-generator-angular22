openapi: 3.1.1
info:
  title: Response Headers API
  version: 1.0.0
tags:
  - name: question
paths:
  /api/questions:
    get:
      tags:
        - question
      operationId: getQuestions
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: One page of questions
          headers:
            X-Has-Next:
              description: Whether another page exists
              schema:
                type: boolean
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Question'
    post:
      tags:
        - question
      operationId: createQuestion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Question'
      responses:
        '201':
          description: The question was created; its location is in the header.
          headers:
            Location:
              schema:
                type: string
    delete:
      tags:
        - question
      operationId: deleteQuestions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: integer
                format: int64
      responses:
        '200':
          description: The number of deleted questions
          headers:
            X-Deleted-Count:
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: integer
                format: int32
  /api/questions/export:
    get:
      tags:
        - question
      operationId: exportQuestions
      responses:
        '200':
          description: The questions as CSV
          headers:
            X-Exported-Count:
              schema:
                type: integer
          content:
            text/csv:
              schema:
                type: string
  /api/questions/archive:
    get:
      tags:
        - question
      operationId: downloadArchive
      responses:
        '200':
          description: The question archive
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
  /api/questions/{questionId}:
    get:
      tags:
        - question
      operationId: getQuestion
      parameters:
        - name: questionId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: The question
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Question'
        '429':
          description: Too many requests
          headers:
            Retry-After:
              schema:
                type: integer
components:
  schemas:
    Question:
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
