openapi: 3.0.3
info:
  title: Query Style API
  version: 1.0.0
paths:
  /api/scores:
    get:
      tags:
        - score
      operationId: searchScores
      parameters:
        - name: filter
          in: query
          style: deepObject
          explode: true
          schema:
            $ref: '#/components/schemas/Filter'
        - name: ids
          in: query
          style: form
          explode: false
          schema:
            type: array
            items:
              type: integer
        - name: point
          in: query
          style: form
          explode: false
          schema:
            $ref: '#/components/schemas/Point'
        - name: pipes
          in: query
          style: pipeDelimited
          explode: false
          schema:
            type: array
            items:
              type: string
        - name: spaces
          in: query
          style: spaceDelimited
          explode: false
          schema:
            type: array
            items:
              type: string
        - name: jsonPoint
          in: query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Point'
        - name: vendorPoint
          in: query
          content:
            application/vnd.example+json:
              schema:
                $ref: '#/components/schemas/Point'
        - name: textName
          in: query
          content:
            text/plain:
              schema:
                type: string
        - name: page
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: The scores
          content:
            application/json:
              schema:
                type: string
components:
  schemas:
    Filter:
      type: object
      properties:
        name:
          type: string
        range:
          $ref: '#/components/schemas/Range'
    Range:
      type: object
      properties:
        min:
          type: integer
    Point:
      type: object
      properties:
        x:
          type: integer
        y:
          type: integer
