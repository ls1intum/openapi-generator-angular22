openapi: 3.1.1
info:
  title: Object Query API
  version: 1.0.0
tags:
  - name: score
  - name: course
paths:
  /api/exercises/{exerciseId}/participations/scores:
    get:
      tags:
        - score
      operationId: getParticipationScores
      parameters:
        - name: exerciseId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: search
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/ParticipationScoreSearch'
        - name: includeTeams
          in: query
          required: false
          schema:
            type: boolean
        - name: teamIds
          in: query
          required: false
          schema:
            type: array
            uniqueItems: true
            items:
              type: integer
              format: int64
      responses:
        '200':
          description: Scores of the matching participations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ParticipationScore'
  /api/courses:
    get:
      tags:
        - course
      operationId: getCourses
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            format: int32
        - name: searchTerm
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/CourseStatus'
      responses:
        '200':
          description: Matching courses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Course'
components:
  schemas:
    ParticipationScoreSearch:
      type: object
      properties:
        searchTerm:
          type: string
        page:
          type: integer
          format: int32
        authorities:
          type: array
          items:
            type: string
        exerciseIds:
          type: array
          uniqueItems: true
          items:
            type: integer
            format: int64
        scoreRange:
          $ref: '#/components/schemas/ScoreRange'
    ScoreRange:
      type: object
      properties:
        lower:
          type: number
        upper:
          type: number
    ParticipationScore:
      type: object
      properties:
        participantName:
          type: string
        score:
          type: number
    CourseStatus:
      type: string
      enum:
        - ACTIVE
        - ARCHIVED
    Course:
      type: object
      properties:
        title:
          type: string
